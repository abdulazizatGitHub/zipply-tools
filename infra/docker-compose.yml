# ToolForge local development stack.
#
# What this provides:
#   - Postgres (primary OLTP)
#   - Redis (cache + queues)
#   - MinIO (S3-compatible local object store; production uses Cloudflare R2)
#   - OpenTelemetry collector → Jaeger (traces) + console (metrics/logs)
#
# What this DOESN'T provide:
#   - Application services. Run those via `pnpm dev` so file watching and
#     debugger attach work natively. The compose stack is the *infra* under
#     them.
#
# Usage:
#   docker compose -f infra/docker-compose.yml up -d
#   docker compose -f infra/docker-compose.yml down

name: toolforge

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: toolforge
      POSTGRES_PASSWORD: toolforge
      POSTGRES_DB: toolforge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolforge -d toolforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-bookworm
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: toolforge
      MINIO_ROOT_PASSWORD: toolforge-dev
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    restart: unless-stopped
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.61
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "14250:14250" # OTLP gRPC (proxied by collector in prod)

volumes:
  postgres-data:
  redis-data:
  minio-data:
