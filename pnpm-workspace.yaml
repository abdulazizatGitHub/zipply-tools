# ToolForge workspace topology.
#
# Layer mapping:
#   apps/*     — user-facing surfaces (web, admin, docs)
#   services/* — backend services (L3 + L4 from PLATFORM_FOUNDATION.md)
#   packages/* — shared libraries (contracts, clients, telemetry, UI, configs)
#   tools/*    — internal CLIs (scaffolding, validators, generators)
#
# Anything outside these four directories is NOT a workspace member.
# This is enforced — do not add ad-hoc root packages.

packages:
  - "apps/*"
  - "services/*"
  - "packages/*"
  - "tools/*"

# Catalogs centralize core dependency versions so every workspace pins the
# same major/minor without each package.json restating them.
catalog:
  typescript: ^5.6.3
  "@types/node": ^22.7.5
  zod: ^3.23.8
  pino: ^9.5.0
  pino-pretty: ^11.2.2
  fastify: ^5.0.0
  "@fastify/sensible": ^6.0.1
  "@fastify/cors": ^10.0.1
  "@fastify/helmet": ^12.0.1
  "@fastify/rate-limit": ^10.1.1
  "@opentelemetry/api": ^1.9.0
  "@opentelemetry/sdk-node": ^0.54.0
  "@opentelemetry/auto-instrumentations-node": ^0.52.0
  "@opentelemetry/exporter-trace-otlp-http": ^0.54.0
  "@opentelemetry/exporter-metrics-otlp-http": ^0.54.0
  "@opentelemetry/resources": ^1.27.0
  "@opentelemetry/semantic-conventions": ^1.27.0
  vitest: ^2.1.3
  tsup: ^8.3.0
  tsx: ^4.19.1
  qrcode: ^1.5.4
  "@types/qrcode": ^1.5.5
